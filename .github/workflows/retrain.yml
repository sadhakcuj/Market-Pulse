name: Retrain model
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0"   # Sundays 03:00 UTC

permissions:
  contents: write

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Train with walk-forward evaluation
        run: python -m training.train
      - name: Test against the new model
        run: pytest -q
      - name: Commit model and metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/direction_model.joblib models/metrics.json
          git diff --cached --quiet || git commit -m "Retrain model $(date -u +%F)"
          git push
